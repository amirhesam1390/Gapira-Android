name: Build Gapira Android

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Gapira APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Gapira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Components
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Source
        run: |
          set -e

          test -f gradlew
          test -f settings.gradle
          test -f TMessagesProj/build.gradle
          test -f TMessagesProj_Modules/media/core_settings.gradle

          echo "Source verification passed."
          git submodule status --recursive

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gapira-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gapira-gradle-${{ runner.os }}-

      - name: Check Build Environment
        run: |
          java -version
          cmake --version || true
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
          df -h
          free -h

      - name: Build Gapira ARM32 + ARM64 Debug
        run: |
          ./gradlew \
            :TMessagesProj_AppStandalone:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            --build-cache

      - name: Verify 32-bit and 64-bit APK
        run: |
          FOUND=0
          while IFS= read -r APK; do
            if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/' &&
               unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
              echo "Both ARM architectures found in: $APK"
              FOUND=1
              break
            fi
          done < <(find . -type f -name "*.apk")

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: APK containing both ARM architectures was not found."
            exit 1
          fi

      - name: Find APK
        if: success()
        run: |
          find . -type f -name "*.apk" -exec ls -lh {} \;

          find . -type f -name "*.apk" | grep -q . || {
            echo "ERROR: APK not found"
            exit 1
          }

      - name: Upload Gapira APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gapira-Android-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Final Report
        if: always()
        run: |
          echo "Gapira Build Finished"
          df -h
